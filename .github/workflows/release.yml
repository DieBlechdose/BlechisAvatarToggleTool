name: Release Packages

# Läuft, sobald sich eine package.json unter Packages/ ändert (z. B. neue Version),
# oder per Hand über "Actions" -> "Release Packages" -> "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - "Packages/**/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build releases and update index.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/release_packages.py

      - name: Commit index.json
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Update VPM listing [skip ci]"
          git push
